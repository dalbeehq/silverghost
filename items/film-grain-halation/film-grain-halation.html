function mkTex(gl,unit,img,mip){
 const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
 if(mip)gl.generateMipmap(gl.TEXTURE_2D);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,mip?gl.LINEAR_MIPMAP_LINEAR:gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 return t;
}
function fitCanvas(canvas){const s=Math.min(devicePixelRatio||1,1.5);const w=Math.max(2,Math.round(canvas.clientWidth*s)),h=Math.max(2,Math.round(canvas.clientHeight*s));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
const PRE=`#version 300 es
precision highp float;
uniform sampler2D uTex;uniform vec2 uRes;uniform float uFocus;
out vec4 outColor;
const vec3 ICE=vec3(.384,.757,.859);
vec2 cover(vec2 uv){float a=uRes.x/uRes.y,ta=16./9.;vec2 s=vec2(1.);if(a>ta)s.y=ta/a;else s.x=a/ta;vec2 c=vec2(.5+(uFocus-.5)*(1.-s.x),.5);return (uv-.5)*s+c;}
vec3 scn(vec2 uv){return texture(uTex,cover(uv)).rgb;}
vec3 scnL(vec2 uv,float l){return textureLod(uTex,cover(uv),l).rgb;}
float lum(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p=p*2.03+17.1;a*=.5;}return s;}
`;

const FRAG=PRE+`
uniform float uT,uFr,uGrain,uHalOn,uHalR,uWeave,uDust;
const vec3 COB=vec3(.043,.294,.561);
vec3 filmTone(vec3 c){
 c=c*c*(3.-2.*c)*.55+c*.45;
 return c*.965+vec3(.010,.015,.028);
}
void main(){
 vec2 uv=gl_FragCoord.xy/uRes;
 float px=uRes.y/720.;
 vec2 asp=vec2(uRes.x/uRes.y,1.);
 float fr=uFr;
 vec2 u=uv;
 float flick=1.;
 if(uWeave>.5){
  vec2 w=(vec2(vnoise(vec2(fr*.31,1.7)),vnoise(vec2(fr*.27,8.3)))-.5)*vec2(.0046,.0062);
  w+=vec2(sin(uT*1.7),cos(uT*1.1))*.0016;
  u+=w;
  flick=1.+(hash21(vec2(fr,2.2))-.5)*.10+.02*sin(uT*9.);
 }
 vec3 col=scn(u);
 if(uGrain>.5)col=filmTone(col);
 if(uHalOn>.5){
  float R=mix(.003,.055,uHalR);
  float lod=mix(1.,3.2,uHalR);
  vec3 hal=vec3(0.);float ws=0.;
  for(int i=0;i<30;i++){
   float k=float(i)/29.;float a=float(i)*2.39996;
   float r=R*(.12+.88*sqrt(k));
   vec3 s=scnL(u+r*vec2(cos(a),sin(a))*vec2(1./asp.x,1.),lod);
   float h=smoothstep(.5,.92,lum(s));
   float w=(1.-k)*(1.-k)+.05;
   hal+=h*w*mix(ICE,COB*1.5,smoothstep(.0,.9,k));ws+=w;
  }
  col+=hal/ws*1.7;
 }
 if(uGrain>.5){
  float l=lum(col);
  vec2 gp=gl_FragCoord.xy/px;
  float g=hash21(gp+fr*7.31)-.5;
  float g2=vnoise(gp*.5+fr*3.1)-.5;
  col+=(g*.14+g2*.10)*(.45+.55*(1.-abs(l*2.-1.)));
  col*=1.-.55*smoothstep(.5,1.1,length((uv-.5)*vec2(1.1,1.)));
 }
 if(uDust>.5){
  float sc=step(.76,hash21(vec2(fr,3.1)));
  float sx=hash21(vec2(fr,9.2));
  col+=vec3(.5,.55,.6)*sc*smoothstep(.0011,0.,abs(uv.x-sx))*(.55+.45*vnoise(vec2(uv.y*70.,fr)));
  for(int i=0;i<3;i++){
   float fi=float(i);
   vec2 dp=vec2(hash21(vec2(fr,4.4+fi)),hash21(vec2(fr,5.5+fi*1.7)));
   float on=step(.4,hash21(vec2(fr,6.6+fi)));
   float d=length((uv-dp)*uRes)/px;
   float rad=1.6+3.*hash21(vec2(fr,7.7+fi));
   col=mix(col,vec3(.82,.9,.95),.85*on*smoothstep(rad,rad*.45,d));
  }
 }
 outColor=vec4(col*flick,1.);
}`;
const canvas=document.getElementById('c');
const fpsEl=document.getElementById('fps');
const stepEls=[...document.querySelectorAll('#steps span')];
const params=new URLSearchParams(location.search);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches||params.get('reduce')==='1';
const capture=location.hash.indexOf('capture')>=0;
const gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
if(!gl){fpsEl.textContent='WebGL2 미지원';return;}
const pr=mkProgram(gl,FRAG);
const U=n=>gl.getUniformLocation(pr,n);
const uRes=U('uRes'),uFocus=U('uFocus'),uT=U('uT'),uFr=U('uFr'),uGrain=U('uGrain'),uHalOn=U('uHalOn'),uHalR=U('uHalR'),uWeave=U('uWeave'),uDust=U('uDust');
const T=10,AT={grain:1.2,hal:2.2,weave:3.4,dust:4.2},HAL_LEN=1.0,STILL_T=6.0;
let lastIdx=-1;
function mark(idx){if(idx===lastIdx)return;lastIdx=idx;stepEls.forEach((e,i)=>{e.className=i===idx?'cur':i<idx?'on':'';});}
function draw(t){
 const lt=((t%T)+T)%T;
 const hp=Math.min(1,Math.max(0,(lt-AT.hal)/HAL_LEN));
 const idx=lt>=AT.dust?4:lt>=AT.weave?3:lt>=AT.hal?2:lt>=AT.grain?1:0;
 mark(idx);
 fitCanvas(canvas);gl.viewport(0,0,canvas.width,canvas.height);
 gl.uniform2f(uRes,canvas.width,canvas.height);gl.uniform1f(uFocus,.38);
 gl.uniform1f(uT,lt);gl.uniform1f(uFr,Math.floor(t*24));
 gl.uniform1f(uGrain,idx>=1?1:0);gl.uniform1f(uHalOn,idx>=2?1:0);gl.uniform1f(uHalR,1-Math.pow(2,-10*hp));
 gl.uniform1f(uWeave,idx>=3?1:0);gl.uniform1f(uDust,idx>=4?1:0);
 gl.drawArrays(gl.TRIANGLES,0,3);
}
loadImage(IMG).then(img=>{
 mkTex(gl,0,img,true);gl.uniform1i(U('uTex'),0);
 window.__step=t=>draw(t);
 if(capture){draw(STILL_T);return;}
 if(reduce){draw(STILL_T);fpsEl.textContent='정지 화면 (동작 줄이기 설정)';addEventListener('resize',()=>draw(STILL_T));return;}
 let t0=performance.now(),cnt=0,tf=t0;
 addEventListener('pointerdown',()=>{t0=performance.now();});
 const loop=now=>{
  draw((now-t0)/1000);
  cnt++;if(now-tf>=500){fpsEl.textContent='초당 프레임 '+Math.round(cnt*1000/(now-tf));cnt=0;tf=now;}
  requestAnimationFrame(loop);};
 requestAnimationFrame(loop);
}).catch(e=>console.error(e.message));
})();
</script>
