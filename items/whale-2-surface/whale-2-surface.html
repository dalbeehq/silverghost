<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아스키 고래 2 수면</title>
<style>
html,body{margin:0;background:#0b0b0c;overflow-x:hidden}
body{height:500vh}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
</style></head><body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PAL={bg:'#0b0b0c',t1:'#f0f0f0',t2:'#b0b0b0',t3:'#787878',c1:'#2c4a82',c2:'#3a9f98'};
const RAMP=' .,:;-~=+*xo#%@';
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches||/[?&]reduce=1/.test(location.search);
const FIX=(location.search.match(/[?&]t=([0-9.]+)/)||[])[1];
function cr(U,V,u){
  let i=0;while(i<U.length-2&&u>U[i+1])i++;
  const t=Math.min(1,Math.max(0,(u-U[i])/(U[i+1]-U[i]))),p0=V[Math.max(0,i-1)],p1=V[i],p2=V[i+1],p3=V[Math.min(V.length-1,i+2)];
  return 0.5*(2*p1+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t);
}

/* humpback: head +x, length L. body tube + long pectoral fins + notched flukes */
function makeWhale(mat){
  const L=4,SEG=110,RAD=44;
  const U  =[0,  .03,.08,.16,.28,.42,.56,.68,.78,.86,.93,1];
  const TOP=[.02,.1, .17,.25,.31,.33,.29,.22,.15,.1, .07,.05];
  const BOT=[.02,.12,.24,.35,.42,.41,.34,.23,.13,.08,.055,.04];
  const WID=[.02,.13,.24,.33,.39,.38,.31,.2, .11,.065,.042,.03];
  const n=(SEG+1)*(RAD+1),base=new Float32Array(n*3),pos=new Float32Array(n*3),uv=new Float32Array(n*2),idx=[];
  for(let i=0;i<=SEG;i++){
    const u=i/SEG,top=cr(U,TOP,u),bot=cr(U,BOT,u),wid=cr(U,WID,u);
    for(let j=0;j<=RAD;j++){
      const th=-Math.PI/2+j/RAD*Math.PI*2,s=Math.sin(th),c=Math.cos(th),k=i*(RAD+1)+j;
      const fin=0.075*Math.exp(-(((u-.67)/.032)**2))*Math.pow(Math.max(0,s),14);
      base[k*3]=(0.5-u)*L;
      base[k*3+1]=1.12*(s>=0?top*s+fin:-bot*Math.pow(-s,0.8));
      base[k*3+2]=wid*Math.sign(c)*Math.pow(Math.abs(c),0.92);
      uv[k*2]=u;uv[k*2+1]=th;
    }
  }
  for(let i=0;i<SEG;i++)for(let j=0;j<RAD;j++){const a=i*(RAD+1)+j,b=a+RAD+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const geo=new THREE.BufferGeometry();geo.setIndex(idx);
  pos.set(base);
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aUV',new THREE.BufferAttribute(uv,2));
  const group=new THREE.Group(),body=new THREE.Mesh(geo,mat(0));group.add(body);

  /* pectoral fin: tapered lens section with tubercles on the leading edge */
  function finGeo(){
    const SP=26,CH=14,p=[],ix=[];
    for(let a=0;a<=SP;a++){
      const s=a/SP,chord=0.27*(1-0.72*s)+0.02,th=0.035*(1-0.7*s),le=0.014*Math.max(0,Math.sin(s*42))*(s<0.92?1:0);
      for(let b=0;b<=CH;b++){
        const g=b/CH*Math.PI*2,cx=Math.cos(g);
        p.push(-s*0.36+chord*0.5*cx+(cx>0?le:0),-s*1.05,th*Math.sin(g));
      }
    }
    for(let a=0;a<SP;a++)for(let b=0;b<CH;b++){const i0=a*(CH+1)+b,i1=i0+CH+1;ix.push(i0,i1,i0+1,i1,i1+1,i0+1);}
    const g=new THREE.BufferGeometry();g.setIndex(ix);g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.computeVertexNormals();return g;
  }
  const fg=finGeo(),finA=new THREE.Mesh(fg,mat(1)),finB=new THREE.Mesh(fg,mat(1));group.add(finA,finB);

  const sh=new THREE.Shape();
  sh.moveTo(0.03,0);
  sh.quadraticCurveTo(-0.04,0.36,-0.36,0.74);
  sh.quadraticCurveTo(-0.3,0.32,-0.29,0.04);
  sh.lineTo(-0.23,0);
  sh.lineTo(-0.29,-0.04);
  sh.quadraticCurveTo(-0.3,-0.32,-0.36,-0.74);
  sh.quadraticCurveTo(-0.04,-0.36,0.03,0);
  const flg=new THREE.ShapeGeometry(sh,24);flg.rotateX(Math.PI/2);
  const fluke=new THREE.Mesh(flg,mat(1));group.add(fluke);

  const wave=(u,t,A)=>A*Math.pow(u,2.2)*Math.sin(5.4*u-2.2*t);
  function animate(t,A,flap){
    for(let k=0;k<n;k++){const u=uv[k*2];pos[k*3+1]=base[k*3+1]+wave(u,t,A);}
    geo.attributes.position.needsUpdate=true;geo.computeVertexNormals();
    const y1=wave(0.97,t,A),y2=wave(1,t,A),ang=Math.atan2(y2-y1,-0.03*L);
    fluke.position.set(-L/2+0.02,y2,0);fluke.rotation.z=(ang-Math.PI)*1.35;
    const fx=(0.5-0.27)*L,fy=-0.26+wave(0.27,t,A),f=0.18*Math.sin(t*0.8)*flap;
    finA.position.set(fx,fy,0.25);finA.rotation.set(-1.2-f,0,-0.5);
    finB.position.set(fx,fy,-0.25);finB.rotation.set(1.2+f,0,-0.5);
  }
  animate(0,0.22,1);
  return {group,animate,L};
}

/* lighting written to a render target: r = luminance, g = rim, a = coverage */
const KEY=new THREE.Vector3(),FILL=new THREE.Vector3();
function whaleMat(kind){
  return new THREE.ShaderMaterial({side:THREE.DoubleSide,uniforms:{uKey:{value:KEY},uFill:{value:FILL},uKind:{value:kind}},
  vertexShader:`attribute vec2 aUV;varying vec3 vN;varying vec3 vP;varying vec2 vUV;
void main(){vUV=aUV;vec4 mv=modelViewMatrix*vec4(position,1.);vP=mv.xyz;vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform vec3 uKey,uFill;uniform float uKind;varying vec3 vN,vP;varying vec2 vUV;
void main(){
  vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;vec3 v=normalize(-vP);
  float key=dot(n,uKey)*.5+.5;key*=key;float fill=max(dot(n,uFill),0.);
  float rim=pow(1.-max(dot(n,v),0.),2.4);
  float lum=.08+.8*key+.3*fill+.25*rim;
  if(uKind<.5){
    float u=vUV.x,th=vUV.y,s=sin(th);
    float belly=smoothstep(-.2,-.6,s)*smoothstep(.56,.4,u)*smoothstep(.02,.07,u);
    lum*=1.-.55*belly*smoothstep(.55,.92,.5+.5*cos(th*64.));
    float e=min(length(vec2((u-.17)*4.,th+.22)),length(vec2((u-.17)*4.,th-3.3616)));
    lum*=1.-.9*(1.-smoothstep(.05,.09,e));
    lum*=1.-.45*smoothstep(.2,.1,u)*smoothstep(.25,.6,s)*step(.72,sin(u*150.)*sin(th*26.));
  }
  gl_FragColor=vec4(pow(smoothstep(.06,1.05,lum),1.25),rim,0.,1.);
}`});
}


const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false});
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,0.1,80);
camera.position.set(0,0,10);camera.lookAt(0,0,0);camera.updateMatrixWorld();
camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
KEY.set(0.4,1,0.6).normalize().transformDirection(camera.matrixWorldInverse);
FILL.set(-0.4,-0.6,0.8).normalize().transformDirection(camera.matrixWorldInverse);
const whale=makeWhale(whaleMat);whale.group.rotation.order='YZX';scene.add(whale.group);
const WATER=0.52;

/* story: t, x, y, z, pitch, roll, yaw, swim amplitude. y=0 is the water surface */
const LOOP=18;
const KF=[
 [0,   -4.5,-7.5,-5,  .5,  0,  -.15,.3],
 [1.8, -2.6,-3.6,-3,  .6,  0,  -.15,.3],
 [3.0, -1.3,-1.6,-1.4,.85, 0,  -.15,.34],
 [3.6, -0.8,-0.6,-0.8,1.15,.1, -.15,.38],
 [4.2, -0.4, 0.45,-0.6,1.2, .5, -.15,.2],
 [4.8,  0.1, 0.95,-0.5,.95,1.3,-.15,.12],
 [5.3,  0.6, 0.7,-0.4,.3, 2.0, -.15,.12],
 [5.8,  1.0, 0.0,-0.3,-.35,2.5,-.15,.15],
 [6.4,  1.3,-1.2,-0.2,-.4, 2.2,-.15,.25],
 [7.4,  1.4,-1.4, 0.2, 0,  1.0,-1.0,.3],
 [8.4,  1.0,-0.9, 0.4, .2, .3, -2.2,.28],
 [9.2,  0.4,-0.22,0.4, .08,0,  -2.95,.16],
 [10.6,-0.8,-0.18,0.3, 0,  0,  -3.05,.12],
 [11.6,-1.6,-0.3, 0.2,-.5, 0,  -3.1,.16],
 [12.4,-2.0,-0.7, 0.1,-1.2,0,  -3.1,.2],
 [13.2,-2.2,-1.6, 0,  -1.45,0, -3.1,.3],
 [14.5,-2.6,-3.6,-1.5,-1.2,0,  -3.1,.3],
 [16.0,-3.2,-7.5,-3, -1.0,0,  -3.1,.3],
 [18.0,-4.5,-7.5,-5,  .5,  0,  -.15,.3]];
function pose(t){
  t=((t%LOOP)+LOOP)%LOOP;let i=0;while(i<KF.length-2&&t>KF[i+1][0])i++;
  const a=KF[Math.max(0,i-1)],b=KF[i],c=KF[i+1],d=KF[Math.min(KF.length-1,i+2)],h=c[0]-b[0],s=(t-b[0])/h;
  const s2=s*s,s3=s2*s,out=[];
  for(let k=1;k<8;k++){
    const m0=(c[k]-a[k])/Math.max(1e-3,c[0]-a[0])*h,m1=(d[k]-b[k])/Math.max(1e-3,d[0]-b[0])*h;
    out.push((2*s3-3*s2+1)*b[k]+(s3-2*s2+s)*m0+(-2*s3+3*s2)*c[k]+(s3-s2)*m1);
  }
  return out;
}

function atlas(cw,ch,scale,font){
  const c=document.createElement('canvas');c.width=15*cw*scale;c.height=ch*scale;
  const x=c.getContext('2d');x.fillStyle='#fff';x.font='bold '+(font*scale)+'px ui-monospace,Menlo,Consolas,monospace';
  x.textAlign='center';x.textBaseline='middle';
  for(let i=0;i<15;i++)x.fillText(RAMP[i],(i+.5)*cw*scale,ch*scale*.54);
  const t=new THREE.CanvasTexture(c);t.flipY=false;t.generateMipmaps=false;t.minFilter=t.magFilter=THREE.NearestFilter;return t;
}
const C=h=>new THREE.Color(h);
const U={uScene:{value:null},uLo:{value:null},uSurf:{value:null},uPart:{value:null},uRes:{value:new THREE.Vector2()},uCell:{value:new THREE.Vector2()},
  uGrid:{value:new THREE.Vector2()},uWater:{value:0},uTime:{value:0},
  cBg:{value:C(PAL.bg)},c1:{value:C(PAL.c1)},c2:{value:C(PAL.c2)},t1:{value:C(PAL.t1)},t2:{value:C(PAL.t2)},t3:{value:C(PAL.t3)}};
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:U,depthTest:false,depthWrite:false,
vertexShader:`void main(){gl_Position=vec4(position.xy,0.,1.);}`,
fragmentShader:`precision highp float;
uniform sampler2D uScene,uLo,uSurf,uPart;uniform vec2 uRes,uCell,uGrid;uniform float uWater,uTime;
uniform vec3 cBg,c1,c2,t1,t2,t3;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float surfAt(float cx){return uWater+.5*sin(cx*.17+uTime*1.5)+.3*sin(cx*.051-uTime*.8)+texture2D(uSurf,vec2((cx+.5)/uGrid.x,.5)).r;}
vec3 pc(float k){return k<1.5?t1:k<2.5?t2:k<3.5?t3:k<4.5?c2:c1;}
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);
  vec2 cell=floor(p/uCell),g=fract(p/uCell);
  float sx=(cell.x+.5)/uGrid.x;
  float sr=floor(surfAt(cell.x)),sl=floor(surfAt(cell.x-1.));
  bool below=cell.y>sr;
  vec2 cc=(cell+.5)*uCell;
  if(below)cc.x+=sin(cell.y*.7+uTime*2.1)*uCell.x*.6;
  vec2 uv=cc/uRes;uv.y=1.-uv.y;vec2 ou=uCell*.25/uRes;
  vec4 s=.25*(texture2D(uScene,uv+vec2(-ou.x,ou.y))+texture2D(uScene,uv+ou)+texture2D(uScene,uv-ou)+texture2D(uScene,uv+vec2(ou.x,-ou.y)));
  float cov=s.a,lum=s.r/max(cov,.001),rim=s.g/max(cov,.001);
  vec4 pt=texture2D(uPart,vec2(sx,(cell.y+.5)/uGrid.y))*255.;
  float id=0.;vec3 col=t3;
  if(pt.r>.5){id=pt.r;col=pc(pt.g);}
  else if(cov>.12){
    float e=lum*smoothstep(.12,.85,cov);
    if(below){e*=.8;id=clamp(floor(pow(e,.85)*15.),1.,14.);col=e<.3?c1:e<.62?c2:t3;}
    else{id=clamp(floor(pow(e,.85)*15.),1.,14.);col=e<.22?t3:e<.55?t2:t1;if(rim>.5&&e>.12&&e<.7)col=c2;}
  }else if(cell.y==sr||(cell.y>=min(sr,sl)&&cell.y<=max(sr,sl))){id=6.;col=t2;}
  else if(!below){if(hash(cell)>.996){id=1.;col=t3;}}
  else{
    float dp=(cell.y-sr)/max(1.,uGrid.y-uWater);
    float n=vn(vec2(cell.x*.045+uTime*.12,cell.y*.2-uTime*.04))*.65+vn(vec2(cell.x*.12-uTime*.25,cell.y*.45))*.35;
    float th=.66+dp*.18;
    if(n>th+.1){id=6.;col=c1;}else if(n>th){id=5.;col=c1;}
    float sp=.2+hash(vec2(cell.x,5.))*.5,k=floor(cell.y+uTime*sp);if(hash(vec2(cell.x,k))>.994){id=1.;col=t3;}
    if(cell.y-sr<2.&&hash(vec2(cell.x,floor(uTime*3.)))>.93){id=5.;col=t3;}
  }
  float a=0.;if(id>0.)a=texture2D(uLo,vec2((id+g.x)/15.,g.y)).a;
  gl_FragColor=vec4(mix(cBg,col,a),1.);
}`}));
const screen=new THREE.Scene(),ocam=new THREE.Camera();screen.add(quad);quad.frustumCulled=false;

let rt=null,W=0,H=0,dpr=1,cols=1,rows=1,cwC=5,chC=8,surfH,surfV,surfBuf,surfTex,partBuf,partTex;
function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  renderer.setPixelRatio(dpr);renderer.setSize(W,H,false);
  const fs=Math.max(7,Math.min(11,Math.round(W/165))),cw=Math.round(fs*.62*dpr),ch=Math.round(fs*1.2*dpr);
  const Wd=Math.round(W*dpr),Hd=Math.round(H*dpr);
  cwC=cw/dpr;chC=ch/dpr;cols=Math.ceil(Wd/cw);rows=Math.ceil(Hd/ch);
  if(U.uLo.value)U.uLo.value.dispose();U.uLo.value=atlas(cw,ch,1,fs*dpr);
  U.uRes.value.set(Wd,Hd);U.uCell.value.set(cw,ch);U.uGrid.value.set(cols,rows);U.uWater.value=Math.round(rows*WATER);
  if(rt)rt.dispose();
  rt=new THREE.WebGLRenderTarget(cols*2,rows*2,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat});
  U.uScene.value=rt.texture;
  surfH=new Float32Array(cols);surfV=new Float32Array(cols);surfBuf=new Float32Array(cols*4);
  if(surfTex)surfTex.dispose();surfTex=new THREE.DataTexture(surfBuf,cols,1,THREE.RGBAFormat,THREE.FloatType);U.uSurf.value=surfTex;
  partBuf=new Uint8Array(cols*rows*4);if(partTex)partTex.dispose();
  partTex=new THREE.DataTexture(partBuf,cols,rows,THREE.RGBAFormat,THREE.UnsignedByteType);partTex.flipY=false;U.uPart.value=partTex;
  const full=WATER<.5?2*(1-WATER):2*WATER,oy=WATER<.5?H*(1-2*WATER):0;
  camera.aspect=W/(H*full);camera.setViewOffset(W,H*full,0,oy,W,H);camera.updateProjectionMatrix();
  whale.group.scale.setScalar(W/H<1?Math.max(.42,W/H*.7):Math.min(.82,W/H*.5));
}
resize();

/* particles in css px: spray, spout, bubbles. each leaves when it crosses the surface line */
const P=[];
function rowOfSurface(x){const c=Math.max(0,Math.min(cols-1,Math.floor(x/cwC)));return U.uWater.value+surfH[c];}
function spray(x,n,power){
  for(let i=0;i<n&&P.length<900;i++){
    const a=-Math.PI/2+(Math.random()-.5)*1.5;const v=(160+Math.random()*420)*power;
    P.push({x:x+(Math.random()-.5)*40,y:rowOfSurface(x)*chC-2,vx:Math.cos(a)*v*.7,vy:Math.sin(a)*v,k:'s',g:Math.random()<.4?3:Math.random()<.5?1:9,c:Math.random()<.5?1:2});
  }
}
function impulse(x,amt){const c=Math.floor(x/cwC);for(let i=-4;i<=4;i++){const j=c+i;if(j>=0&&j<cols)surfV[j]+=amt*(1-Math.abs(i)/5);}}
const SAMPLES=[0,.2,.4,.6,.8,1],prevY=new Array(SAMPLES.length).fill(null),lastHit=new Array(SAMPLES.length).fill(-9);
const tmp=new THREE.Vector3();
function toScreen(v){tmp.copy(v).project(camera);return [(tmp.x*.5+.5)*W,(1-(tmp.y*.5+.5))*H];}
let simClock=0;
function step(dt,clock){
  simClock+=dt;
  for(let i=0;i<SAMPLES.length;i++){
    const u=SAMPLES[i];tmp.set((0.5-u)*whale.L,0,0);whale.group.localToWorld(tmp);
    const y=tmp.y,py=prevY[i];prevY[i]=y;
    if(py!==null&&Math.sign(y)!==Math.sign(py)&&simClock-lastHit[i]>.3&&Math.abs(y-py)<1){
      lastHit[i]=simClock;const [sx]=toScreen(tmp);const sp=Math.min(3,Math.abs(y-py)/Math.max(dt,1e-3));
      if(sx>-50&&sx<W+50){impulse(sx,(y<py?1:-1)*(1.2+sp*.9));spray(sx,Math.round(8+sp*16),.55+sp*.25);}
    }
  }
  /* spout from the blowhole while the back is at the surface */
  const lc=((clock%LOOP)+LOOP)%LOOP;
  if(lc>9.7&&lc<10.5){
    tmp.set((0.5-.13)*whale.L,.3,0);whale.group.localToWorld(tmp);
    if(tmp.y>-0.3){const [sx]=toScreen(tmp);for(let i=0;i<3&&P.length<900;i++)P.push({x:sx+(Math.random()-.5)*10,y:rowOfSurface(sx)*chC-chC,vx:(Math.random()-.5)*60,vy:-(420+Math.random()*260),k:'s',g:Math.random()<.5?3:2,c:2});}
  }
  /* bubbles from the head while below the surface */
  tmp.set((0.5-.05)*whale.L,0,0);whale.group.localToWorld(tmp);
  if(tmp.y<-0.4&&Math.random()<dt*14){const [sx,sy]=toScreen(tmp);if(sy>0&&sy<H)P.push({x:sx+(Math.random()-.5)*30,y:sy,vx:0,vy:-(50+Math.random()*60),k:'b',g:Math.random()<.4?11:1,c:Math.random()<.5?4:3,ph:Math.random()*6});}
  for(let i=P.length-1;i>=0;i--){
    const q=P[i];
    if(q.k==='b'){q.y+=q.vy*dt;q.x+=Math.sin(simClock*3+q.ph)*12*dt;if(q.y/chC<=rowOfSurface(q.x)+1){P.splice(i,1);}continue;}
    q.vy+=1100*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.vy>0&&q.y/chC>=rowOfSurface(q.x)){P.splice(i,1);continue;}
  }
  /* surface height field, in rows (positive is down) */
  const n=cols;
  for(let s=0;s<2;s++){
    for(let i=0;i<n;i++){const l=surfH[Math.max(0,i-1)],r=surfH[Math.min(n-1,i+1)];surfV[i]+=((l+r-2*surfH[i])*.22-surfH[i]*.012);surfV[i]*=.975;}
    for(let i=0;i<n;i++)surfH[i]+=surfV[i]*.5;
  }
}
function writeTextures(){
  for(let i=0;i<cols;i++)surfBuf[i*4]=Math.max(-6,Math.min(6,surfH[i]));
  surfTex.needsUpdate=true;
  partBuf.fill(0);
  for(const q of P){
    const cx=Math.floor(q.x/cwC),cy=Math.floor(q.y/chC);
    if(cx<0||cy<0||cx>=cols||cy>=rows)continue;
    const o=(cy*cols+cx)*4;partBuf[o]=q.g;partBuf[o+1]=q.c;
  }
  partTex.needsUpdate=true;
}

function placeWhale(clock){
  const [x,y,z,pitch,roll,yaw,A]=pose(clock);
  whale.group.position.set(x,y,z);whale.group.rotation.set(roll,yaw,pitch);
  whale.animate(clock*1.15,A,1);whale.group.updateMatrixWorld(true);
}
function render(clock){
  U.uTime.value=clock;writeTextures();
  renderer.setRenderTarget(rt);renderer.setClearColor(0x000000,0);renderer.clear();renderer.render(scene,camera);
  renderer.setRenderTarget(null);renderer.render(screen,ocam);
}

/* scroll scrubs the story; with no scroll for a while the story keeps playing */
let clock=0,scrollAt=-1e9,target=0;
function scrollP(){const m=document.documentElement.scrollHeight-innerHeight;return m>0?Math.min(1,Math.max(0,scrollY/m)):0;}
addEventListener('scroll',()=>{scrollAt=performance.now();target=scrollP()*LOOP;});
function still(T){
  clock=T-1.5;for(let i=0;i<90;i++){placeWhale(clock);step(1/60,clock);clock+=1/60;}
  placeWhale(T);render(T);
}
addEventListener('resize',()=>{resize();if(REDUCE||FIX)still(FIX?parseFloat(FIX):4.75);});
let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  if(now-scrollAt<1200)clock+=(target-clock)*Math.min(1,dt*6);else clock+=dt;
  placeWhale(clock);step(dt,clock);render(clock);
  requestAnimationFrame(frame);
}
if(REDUCE||FIX)still(FIX?parseFloat(FIX):4.75);else requestAnimationFrame(frame);
</script></body></html>
