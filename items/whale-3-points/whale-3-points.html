<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아스키 고래 3 점 구름</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0c;overflow:hidden;}
canvas{display:block;position:fixed;inset:0}
#orb{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 50% 60%,#f0f0f0 55%,#b0b0b0 100%);box-shadow:0 0 3rem .4rem #3a9f98;pointer-events:none;will-change:transform}
body{cursor:none}
</style></head><body>
<canvas id="c"></canvas><div id="orb"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches||/[?&]reduce=1/.test(location.search);
/* procedural whale (three r128). head faces +x. units: body length 4 */
function makeWhale(THREE){
  const L=4, SEG=70, RAD=28;
  const prof=u=>0.72*Math.pow(Math.sin(Math.PI*Math.pow(u,0.72)),0.85)*(1-0.55*u)*(u>0.62?Math.max(0.25,1-(u-0.62)*1.9):1);
  const geo=new THREE.BufferGeometry();
  const n=(SEG+1)*(RAD+1);
  const pos=new Float32Array(n*3), base=new Float32Array(n*3);
  const idx=[];
  for(let i=0;i<=SEG;i++){
    const u=i/SEG;
    for(let j=0;j<=RAD;j++){
      const th=j/RAD*Math.PI*2, r=prof(u);
      const k=(i*(RAD+1)+j)*3;
      base[k]=(0.5-u)*L;
      base[k+1]=Math.cos(th)*r*(Math.sin(th)<0?0.8:0.9)*(Math.cos(th)<0?0.9:1);
      base[k+2]=Math.sin(th)*r;
    }
  }
  for(let i=0;i<SEG;i++)for(let j=0;j<RAD;j++){
    const a=i*(RAD+1)+j,b=a+RAD+1;
    idx.push(a,b,a+1,b,b+1,a+1);
  }
  geo.setIndex(idx);
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const wave=(x,t)=>{const u=(0.5-x/L);return 0.24*u*u*Math.sin(5.2*u-2.6*t)};
  function update(t){
    for(let k=0;k<base.length;k+=3){
      pos[k]=base[k];pos[k+1]=base[k+1]+wave(base[k],t);pos[k+2]=base[k+2]+0.05*Math.sin(2.0*(0.5-base[k]/L)-1.3*t)*(0.5-base[k]/L);
    }
    geo.attributes.position.needsUpdate=true;geo.computeVertexNormals();
  }
  const group=new THREE.Group();
  const body=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:0xffffff,side:THREE.DoubleSide}));
  group.add(body);
  const mat=()=>new THREE.MeshLambertMaterial({color:0xffffff,side:THREE.DoubleSide});
  const fluke=new THREE.Mesh(new THREE.SphereGeometry(1,20,10),mat());
  fluke.scale.set(0.2,0.03,0.95);group.add(fluke);
  const finL=new THREE.Mesh(new THREE.SphereGeometry(1,16,8),mat()),finR=new THREE.Mesh(new THREE.SphereGeometry(1,16,8),mat());
  finL.scale.set(0.5,0.04,0.17);finR.scale.set(0.5,0.04,0.17);group.add(finL,finR);
  function animate(t){
    update(t);
    const xe=-L/2, ye=wave(xe,t), dx=0.02, slope=(wave(xe+dx,t)-wave(xe-dx,t))/(2*dx);
    fluke.position.set(xe-0.04,ye,0);fluke.rotation.z=Math.atan(slope)*-1+0;
    const fx=(0.5-0.34)*L, fy=-0.32, flap=0.35*Math.sin(t*1.6);
    const y0=fy+wave(fx,t)*0.8;
    finL.position.set(fx,y0,0.5);finL.rotation.set(0.5+flap,0.2,-0.5);
    finR.position.set(fx,y0,-0.5);finR.rotation.set(-0.5-flap,-0.2,-0.5);
  }
  animate(0);
  /* surface samples for the point-cloud version */
  function samplePoints(count){
    const out=new Float32Array(count*3);let c=0;
    while(c<count){
      const roll=Math.random();
      if(roll<0.82){
        const u=Math.random(),th=Math.random()*Math.PI*2,r=prof(u);
        out[c*3]=(0.5-u)*L;out[c*3+1]=Math.cos(th)*r*(Math.sin(th)<0?0.8:0.9);out[c*3+2]=Math.sin(th)*r;
      }else if(roll<0.92){
        const a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random());
        out[c*3]=-L/2-0.04+Math.cos(a)*0.2*rr;out[c*3+1]=Math.sin(a)*0.03*rr;out[c*3+2]=Math.sin(a)*0.95*rr;
      }else{
        const s=Math.random()<0.5?1:-1,a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random());
        out[c*3]=(0.5-0.34)*L+Math.cos(a)*0.5*rr;out[c*3+1]=-0.32+Math.sin(a)*0.04*rr-0.2*rr;out[c*3+2]=s*(0.5+Math.sin(a)*0.17*rr);
      }
      c++;
    }
    return {pos:out,wave};
  }
  return {group,animate,samplePoints,wave,L};
}

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:true});
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,0.1,50);camera.position.set(0,2.4,6.9);camera.lookAt(0,0,0);
const whale=makeWhale(THREE);
const N=11000,sp=whale.samplePoints(N);
const sizes=new Float32Array(N),cols=new Float32Array(N*3),rnd=new Float32Array(N);
/* palette A: t1 t2 t3 achromatic, c2 teal, c1 navy */
const pal=[[0.941,0.941,0.941],[0.69,0.69,0.69],[0.471,0.471,0.471],[0.227,0.624,0.596],[0.173,0.29,0.51]];
const wts=[0.1,0.24,0.22,0.26,0.18];
for(let i=0;i<N;i++){
  sizes[i]=0.5+Math.random()*1.0;rnd[i]=Math.random();
  let r=Math.random(),k=0;for(;k<wts.length-1;k++){if(r<wts[k])break;r-=wts[k];}
  cols.set(pal[k],i*3);
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(sp.pos,3));
geo.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));
geo.setAttribute('aColor',new THREE.BufferAttribute(cols,3));
geo.setAttribute('aRnd',new THREE.BufferAttribute(rnd,1));
const uni={uTime:{value:0},uMouse:{value:new THREE.Vector2(0,0)},uCollapse:{value:0},uPx:{value:1},uL:{value:whale.L}};
const mat=new THREE.ShaderMaterial({uniforms:uni,depthTest:false,transparent:false,blending:THREE.AdditiveBlending,
vertexShader:`
uniform float uTime,uCollapse,uPx,uL;uniform vec2 uMouse;
attribute float aSize,aRnd;attribute vec3 aColor;varying vec3 vC;
mat3 ry(float a){float c=cos(a),s=sin(a);return mat3(c,0.,s,0.,1.,0.,-s,0.,c);}
mat3 rz(float a){float c=cos(a),s=sin(a);return mat3(c,-s,0.,s,c,0.,0.,0.,1.);}
void main(){
  vec3 p=position;
  float u=0.5-p.x/uL;
  p.y+=0.24*u*u*sin(5.2*u-2.6*uTime*1.1);
  p+=0.035*vec3(sin(p.y*7.+uTime*1.3+aRnd*6.),sin(p.z*6.+uTime+aRnd*5.),sin(p.x*5.+uTime*.8+aRnd*4.));
  p=rz(-uMouse.y*0.3)*ry(-uMouse.x*0.8)*p;
  float c=smoothstep(aRnd*0.5,0.5+aRnd*0.5,uCollapse);
  p=mix(p,vec3(0.)+0.06*vec3(sin(aRnd*40.),cos(aRnd*55.),sin(aRnd*70.)),c);
  vec4 mv=modelViewMatrix*vec4(p,1.);
  gl_Position=projectionMatrix*mv;
  gl_PointSize=aSize*uPx*(26./-mv.z)*(1.-0.35*c);
  vC=aColor;
}`,
fragmentShader:`
varying vec3 vC;
void main(){float d=distance(gl_PointCoord,vec2(.5));if(d>.5)discard;gl_FragColor=vec4(vC*0.42,1.);}`});
scene.add(new THREE.Points(geo,mat));
function resize(){const dpr=Math.min(devicePixelRatio||1,2);renderer.setPixelRatio(dpr);renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();uni.uPx.value=dpr*(innerHeight/720);scene.scale.setScalar(Math.min(1,camera.aspect/1.5)*1.05);}
resize();addEventListener('resize',()=>{resize();if(REDUCE)draw(2.4);});
const m={x:0.35,y:-0.1,tx:0.35,ty:-0.1},orb=document.getElementById('orb'),o={x:innerWidth*0.675,y:innerHeight*0.45};
const pos={x:innerWidth*0.675,y:innerHeight*0.45};
let down=false;
addEventListener('mousemove',e=>{m.tx=e.clientX/innerWidth*2-1;m.ty=e.clientY/innerHeight*2-1;pos.x=e.clientX;pos.y=e.clientY;});
addEventListener('mousedown',()=>down=true);addEventListener('mouseup',()=>down=false);
function draw(t){uni.uTime.value=t;uni.uMouse.value.set(m.x,m.y);renderer.render(scene,camera);}
const T0=performance.now();
function frame(now){
  m.x+=(m.tx-m.x)*0.045;m.y+=(m.ty-m.y)*0.045;
  o.x+=(pos.x-o.x)*0.15;o.y+=(pos.y-o.y)*0.15;
  orb.style.transform='translate('+o.x+'px,'+o.y+'px)';
  uni.uCollapse.value+=((down?1:0)-uni.uCollapse.value)*0.06;
  draw((now-T0)/1000);requestAnimationFrame(frame);
}
if(REDUCE){orb.style.transform='translate('+o.x+'px,'+o.y+'px)';draw(2.4);}else requestAnimationFrame(frame);
</script></body></html>
