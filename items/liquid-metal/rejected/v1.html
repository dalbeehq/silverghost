<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>액체 금속</title>
<style>
html,body{margin:0;height:100%;background:#070b12;overflow:hidden}
body{display:grid;grid-template-rows:1fr auto}
#stage{min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{display:flex;gap:8px 20px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 16px;font:13px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#c9d1d3;background:#0c121b;border-top:1px solid #1d2a38}
#bar b{color:#e6ecea;font-weight:600;margin-right:8px}
#fps{font-variant-numeric:tabular-nums;color:#9fb5ad;white-space:nowrap}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar"><div><b>액체 금속</b><span id="desc">흐르는 금속 표면이 주변 색을 비춥니다. 마우스 주변이 솟아오릅니다. 색 #0b1626 #1d5560 #4a3578 #566b5a. 밝은 빛은 곡률 높은 가장자리 분산뿐입니다.</span></div><div id="fps">초당 프레임 -</div></div>
<script>
(()=>{
const CFG={"frag": "\nfloat H(vec2 p){\n vec2 q=p*1.6;\n q+=.7*vec2(fbm(q+vec2(0.,uTime*.12)),fbm(q+vec2(5.2,1.3)-uTime*.1));\n q+=.5*vec2(fbm(q*1.3+3.1+uTime*.08),fbm(q*1.3-2.2));\n float h=fbm(q*1.1);\n vec2 m=(uMouse-.5)*vec2(uRes.x/uRes.y,1.);\n h+=.45*exp(-dot(p-m,p-m)*9.);\n return h;\n}\nvec3 env(vec3 r){\n float y=r.y*.5+.5;\n vec3 c=mix(vec3(.04,.07,.12),vec3(.12,.26,.30),smoothstep(.1,.9,y));\n c+=vec3(.22,.14,.36)*smoothstep(.55,.0,abs(r.x+.35))*smoothstep(.2,.8,y)*.8;\n c+=vec3(.36,.45,.40)*smoothstep(.12,.0,abs(r.x*1.0-.5*r.y+.2))*.5;\n return c;\n}\nvec3 shade(vec2 uv,vec2 p){\n float e=.004;\n float h=H(p);\n vec2 g=vec2(H(p+vec2(e,0))-H(p-vec2(e,0)),H(p+vec2(0,e))-H(p-vec2(0,e)))/(2.*e);\n vec3 n=normalize(vec3(-g*.35,1.));\n vec3 v=vec3(0,0,1);\n vec3 r=reflect(-v,n);\n float fr=pow(1.-n.z,2.2);\n vec3 c;\n c.r=env(reflect(-v,normalize(vec3(-g*.35*1.00,1.)))).r;\n c.g=env(reflect(-v,normalize(vec3(-g*.35*1.06,1.)))).g;\n c.b=env(reflect(-v,normalize(vec3(-g*.35*1.13,1.)))).b;\n c*=.55+.9*smoothstep(.2,.8,h);\n float cur=length(g);\n vec3 sp=spec(fract(h*2.2+.15));sp=mix(sp,vec3(dot(sp,vec3(.34))),.7);\n c+=sp*smoothstep(1.8,3.8,cur)*.4;\n c=mix(c,c*vec3(.7,.9,.95),fr);\n c*=1.-.4*smoothstep(.55,1.1,length(p));\n return c;\n}", "still": 5.0, "animated": false, "scale": null};
const W=1280,H=720;
const canvas=document.getElementById('c');
const fpsEl=document.getElementById('fps');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const capture=location.hash.indexOf('capture')>=0;
const gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
if(!gl){fpsEl.textContent='WebGL2 미지원';return;}
function drawBg(c,w,h,t){c.fillStyle="#000";c.fillRect(0,0,w,h);}
const bgC=document.createElement('canvas');bgC.width=W;bgC.height=H;const bgX=bgC.getContext('2d');
const mkC=document.createElement('canvas');mkC.width=W;mkC.height=H;const mkX=mkC.getContext('2d');
const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const PRE=`#version 300 es
precision highp float;
uniform sampler2D uTex;uniform sampler2D uMask;uniform vec2 uRes;uniform float uTime;uniform vec2 uMouse;uniform float uScroll;uniform float uFrame;
out vec4 outColor;
vec2 cover(vec2 uv){float a=uRes.x/uRes.y,ta=16./9.;vec2 s=vec2(1.);if(a>ta)s.y=ta/a;else s.x=a/ta;return (uv-.5)*s+.5;}
vec3 scn(vec2 uv){return texture(uTex,cover(uv)).rgb;}
vec3 scnL(vec2 uv,float l){return textureLod(uTex,cover(uv),l).rgb;}
float msk(vec2 uv){return texture(uMask,cover(uv)).r;}
float mskL(vec2 uv,float l){return textureLod(uMask,cover(uv),l).r;}
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p=p*2.03+17.1;a*=.5;}return s;}
vec3 spec(float x){return clamp(vec3(1.5-abs(4.*x-3.),1.5-abs(4.*x-2.),1.5-abs(4.*x-1.)),0.,1.);}
`;
const POST=`
void main(){vec2 uv=gl_FragCoord.xy/uRes;vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y;outColor=vec4(shade(uv,p),1.);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error('shader',gl.getShaderInfoLog(s));}return s;}
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,PRE+CFG.frag+POST));
gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))console.error('link',gl.getProgramInfoLog(pr));
gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
function mkTex(unit){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.MIRRORED_REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.MIRRORED_REPEAT);return t;}
const tBg=mkTex(0),tMk=mkTex(1);
function upload(unit,t,c){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);gl.generateMipmap(gl.TEXTURE_2D);}
const U=n=>gl.getUniformLocation(pr,n);
const uTex=U('uTex'),uMask=U('uMask'),uRes=U('uRes'),uTime=U('uTime'),uMouse=U('uMouse'),uScroll=U('uScroll'),uFrame=U('uFrame');
gl.uniform1i(uTex,0);gl.uniform1i(uMask,1);
if(typeof drawMask==='function'){drawMask(mkX,W,H);upload(1,tMk,mkC);}
let bgDrawn=false;
const st={m:[.5,.5],sc:0,last:-1e9};
const auto=t=>({m:[.5+.28*Math.cos(t*.7),.5+.2*Math.sin(t*1.1)],sc:.5+.5*Math.sin(t*.45)});
addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();st.m=[(e.clientX-r.left)/r.width,1-(e.clientY-r.top)/r.height];st.tm=st.m;st.last=performance.now();});
addEventListener('wheel',e=>{st.sc=Math.min(1,Math.max(0,st.sc+e.deltaY*.0008));st.last=performance.now();},{passive:true});
function resize(){const s=CFG.scale||Math.min(devicePixelRatio||1,1.5);const w=Math.max(2,Math.round(canvas.clientWidth*s)),h=Math.max(2,Math.round(canvas.clientHeight*s));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
function draw(t,mm,sc){
 resize();gl.viewport(0,0,canvas.width,canvas.height);
 if(CFG.animated||!bgDrawn){drawBg(bgX,W,H,t);upload(0,tBg,bgC);bgDrawn=true;}
 gl.uniform2f(uRes,canvas.width,canvas.height);gl.uniform1f(uTime,t);gl.uniform2f(uMouse,mm[0],mm[1]);gl.uniform1f(uScroll,sc);gl.uniform1f(uFrame,Math.floor(t*24));
 gl.drawArrays(gl.TRIANGLES,0,3);
}
window.__step=t=>{const a=auto(t);draw(t,a.m,a.sc);};
if(capture){window.__step(0);}
else if(reduce){const a=auto(CFG.still);draw(CFG.still,a.m,a.sc);fpsEl.textContent='정지 화면 (동작 줄이기 설정)';addEventListener('resize',()=>draw(CFG.still,a.m,a.sc));}
else{
 let t0=performance.now(),cnt=0,tf=t0;
 const loop=now=>{
  const t=(now-t0)/1000;const a=auto(t);
  if(now-st.last>3000){st.m=[st.m[0]+(a.m[0]-st.m[0])*.08,st.m[1]+(a.m[1]-st.m[1])*.08];st.sc+=(a.sc-st.sc)*.04;}
  draw(t,st.m,st.sc);
  cnt++;if(now-tf>=500){fpsEl.textContent='초당 프레임 '+Math.round(cnt*1000/(now-tf));cnt=0;tf=now;}
  requestAnimationFrame(loop);};
 requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
