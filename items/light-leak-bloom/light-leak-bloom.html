const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
function sh(gl,type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error('shader',gl.getShaderInfoLog(s));return s;}
function mkProgram(gl,frag){
 const pr=gl.createProgram();
 gl.attachShader(pr,sh(gl,gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl,gl.FRAGMENT_SHADER,frag));
 gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))console.error('link',gl.getProgramInfoLog(pr));
 gl.useProgram(pr);
 const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 return pr;
}
function loadImage(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('image load'));i.src=src;});}
function mkTex(gl,unit,img,mip){
 const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
 if(mip)gl.generateMipmap(gl.TEXTURE_2D);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,mip?gl.LINEAR_MIPMAP_LINEAR:gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 return t;
}
function fitCanvas(canvas){const s=Math.min(devicePixelRatio||1,1.5);const w=Math.max(2,Math.round(canvas.clientWidth*s)),h=Math.max(2,Math.round(canvas.clientHeight*s));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
const PRE=`#version 300 es
precision highp float;
uniform sampler2D uTex;uniform vec2 uRes;uniform float uFocus;
out vec4 outColor;
const vec3 ICE=vec3(.384,.757,.859);
vec2 cover(vec2 uv){float a=uRes.x/uRes.y,ta=16./9.;vec2 s=vec2(1.);if(a>ta)s.y=ta/a;else s.x=a/ta;vec2 c=vec2(.5+(uFocus-.5)*(1.-s.x),.5);return (uv-.5)*s+c;}
vec3 scn(vec2 uv){return texture(uTex,cover(uv)).rgb;}
vec3 scnL(vec2 uv,float l){return textureLod(uTex,cover(uv),l).rgb;}
float lum(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p=p*2.03+17.1;a*=.5;}return s;}
`;

const FRAG=PRE+`
uniform sampler2D uMask;
uniform float uT,uA,uB;
const vec3 COBL=vec3(.169,.439,.82);
float msk(vec2 uv){return texture(uMask,cover(uv)).r;}
void main(){
 vec2 uv=gl_FragCoord.xy/uRes;
 vec2 q=cover(uv);
 vec2 p=(q-.5)*vec2(16./9.,1.);
 vec3 base=scn(uv);
 float m=msk(uv);
 float lb=lum(base);
 float pulse=.82+.18*sin(uT*2.3+p.x*3.);
 float wA=exp(-pow(((p.x-uA)+p.y*.35)/.23,2.));
 float wB=exp(-pow(((p.x-uB)-p.y*.35)/.09,2.));
 vec3 streak=vec3(0.);
 for(int i=-16;i<=16;i++){
  float f=float(i)/16.;
  vec3 s=scnL(uv+vec2(f*.2,0.),1.);
  streak+=max(lum(s)-.5,0.)*(1.-abs(f))*(1.-abs(f))*mix(ICE,COBL,.35);
 }
 streak/=8.;
 vec3 hal=vec3(0.);
 for(int i=0;i<14;i++){
  float a=float(i)*2.39996;float r=.008+.04*sqrt(float(i)/13.);
  vec3 s=scnL(uv+r*vec2(cos(a),sin(a))*vec2(uRes.y/uRes.x,1.),1.5);
  hal+=max(lum(s)-.5,0.)*ICE;
 }
 hal/=14.;
 float swell=1.+1.6*max(wA,wB);
 vec3 light=(streak*2.6+hal*3.0)*pulse*swell;
 float catchA=.42+.58*smoothstep(.02,.45,lb);
 float tex=.6+.4*fbm(p*4.+vec2(uT*.15,0.));
 vec3 lcA=mix(ICE,COBL,smoothstep(.3,-.3,p.y));
 vec3 lcB=mix(ICE,vec3(1.),.25);
 light+=wA*tex*lcA*catchA*1.5+wB*tex*lcB*catchA*1.3;
 vec3 col=1.-(1.-base)*(1.-clamp(light*m,0.,1.));

}`;
const canvas=document.getElementById('c');
const fpsEl=document.getElementById('fps');
const params=new URLSearchParams(location.search);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches||params.get('reduce')==='1';
const capture=location.hash.indexOf('capture')>=0;
const gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
if(!gl){fpsEl.textContent='WebGL2 미지원';return;}
const pr=mkProgram(gl,FRAG);
const U=n=>gl.getUniformLocation(pr,n);
const uRes=U('uRes'),uFocus=U('uFocus'),uT=U('uT'),uA=U('uA'),uB=U('uB');
const T=9,PASS_A=[2.0,6.6],PASS_B=[7.0,8.9],STILL_T=4.3;
const ease=u=>.5-.5*Math.cos(Math.PI*Math.min(1,Math.max(0,u)));
function pos(t,pass,from,to){if(t<pass[0]||t>pass[1])return 9;return from+(to-from)*ease((t-pass[0])/(pass[1]-pass[0]));}
function draw(t){
 const lt=((t%T)+T)%T;
 fitCanvas(canvas);gl.viewport(0,0,canvas.width,canvas.height);
 gl.uniform2f(uRes,canvas.width,canvas.height);gl.uniform1f(uFocus,.55);
 gl.uniform1f(uT,lt);gl.uniform1f(uA,pos(lt,PASS_A,-.72,.72));gl.uniform1f(uB,pos(lt,PASS_B,.72,-.72));
 gl.drawArrays(gl.TRIANGLES,0,3);
}
Promise.all([loadImage(IMG),loadImage(MASK)]).then(([img,mk])=>{
 mkTex(gl,0,img,true);gl.uniform1i(U('uTex'),0);
 mkTex(gl,1,mk,false);gl.uniform1i(U('uMask'),1);
 window.__step=t=>draw(t);
 if(capture){draw(STILL_T);return;}
 if(reduce){draw(STILL_T);fpsEl.textContent='정지 화면 (동작 줄이기 설정)';addEventListener('resize',()=>draw(STILL_T));return;}
 let t0=performance.now(),cnt=0,tf=t0;
 const loop=now=>{
  draw((now-t0)/1000);
  cnt++;if(now-tf>=500){fpsEl.textContent='초당 프레임 '+Math.round(cnt*1000/(now-tf));cnt=0;tf=now;}
  requestAnimationFrame(loop);};
 requestAnimationFrame(loop);
}).catch(e=>console.error(e.message));
})();
