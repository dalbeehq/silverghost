    vx[i]=(vx[i]+(tx-x[i])*0.07)*0.8;vy[i]=(vy[i]+(ty-y[i])*0.07)*0.8;
    x[i]+=vx[i];y[i]+=vy[i];
  }
  for(var k=0;k<5;k++){
    ctx.fillStyle=COL[k];var o=order[k];
    ctx.beginPath();for(var j=0;j<o.length;j++){i=o[j];var r=sz[i]*0.5;ctx.moveTo(x[i]+r,y[i]);ctx.arc(x[i],y[i],r,0,6.2832)}ctx.fill();
  }
  requestAnimationFrame(frame);
}
